  <!-- Inner surface -->
  <path
    d="M64 19C43 19 29 34 29 54
       C29 73 64 101 64 101
       C64 101 99 73 99 54
       C99 34 85 19 64 19Z"
    fill="#101C2C"
  />

  <!-- Road -->
  <path
    d="M43 78C52 65 53 51 65 36
       C72 27 80 25 87 24"
    stroke="#F4F7FA"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Road centre line -->
  <path
    d="M43 78C52 65 53 51 65 36
       C72 27 80 25 87 24"
    stroke="#55E6A5"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="5 7"
  />

  <!-- Destination dot -->
  <circle cx="91" cy="23" r="6" fill="#55E6A5"/>

</svg>
