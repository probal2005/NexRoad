<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     fill="none">

  <defs>
    <linearGradient id="pin" x1="18" y1="10" x2="108" y2="118"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E6A5"/>
      <stop offset="1" stop-color="#16B981"/>
    </linearGradient>
  </defs>

  <!-- Location pin -->
  <path
    d="M64 8C37.5 8 17 28.5 17 54
       C17 84 64 120 64 120
       C64 120 111 84 111 54
       C111 28.5 90.5 8 64 8Z"
